# ─────────────────────────────────────────────────────────────────────────────
#  lidguard settings
#
#  Easiest: right-click the menu bar icon → Settings…
#  Or edit here and save — changes apply within a few seconds.
#  No restart or reinstall needed. Lines starting with # are just notes.
#  Keep the format exactly NAME=value (no spaces around the =).
# ─────────────────────────────────────────────────────────────────────────────


# ON / OFF SWITCH
#   yes = keep the Mac awake while Herdr agents are working
#   no  = do nothing; the Mac sleeps normally (lidguard stays running, idle)
ENABLED=yes


# KEEP AWAKE (like caffeinate)
#   yes = keep the Mac on no matter what — agents or not, lid open or closed,
#         and the screen stays on while the lid is open. Ignores the battery,
#         Low Power and time-limit rules below, and the on/off switch above.
#         (The heat cut-off still applies with the lid closed.)
#   no  = normal behaviour
KEEP_AWAKE_ALWAYS=no

# KEEP AWAKE UNTIL
#   Leave empty to keep awake until you turn it off. Or a time like
#   2026-11-14T19:00 — Keep Awake switches itself off then.
#   (The menu bar's "Keep Awake for…" options fill this in for you.)
KEEP_AWAKE_UNTIL=


# WAIT FOR YOUR INPUT (minutes)
#   If an agent stops to ask you something (approval / question), stay awake
#   this long so you can answer remotely, then let the Mac sleep. 0 = don't wait.
WAIT_FOR_INPUT_MINUTES=3


# LOW BATTERY CUT-OFF (percent)
#   On battery, if charge falls below this, let the Mac sleep even if agents
#   are still working. Ignored while plugged in.
MIN_BATTERY_PERCENT=20


# LOW POWER MODE
#   yes = if Low Power Mode is on, let the Mac sleep even if agents are working
#   no  = ignore Low Power Mode
SLEEP_IN_LOW_POWER_MODE=yes


# HEAT CUT-OFF
#   With the lid closed, if macOS reports the Mac is this hot for over a
#   minute, put it to sleep (e.g. running hard in a bag). Applies to Keep Awake too.
#   serious = recommended · critical = only when very hot · fair = cautious · off
HEAT_LIMIT=serious


# LID-CLOSED LIMIT ON BATTERY (hours)
#   Safety cap: with the lid closed on battery, never stay awake longer than
#   this. Plugged in there is no limit. Whole or half hours, e.g. 4 or 1.5
BATTERY_LID_CLOSED_LIMIT_HOURS=4


# EXTERNAL MONITOR
#   yes = if the lid is closed but a monitor is plugged in (desk setup),
#         never force the Mac to sleep
#   no  = treat it like any other closed lid
LEAVE_ALONE_WITH_EXTERNAL_MONITOR=yes


# LOCK SCREEN WHEN LID CLOSES
#   yes = lock the screen as soon as the lid is closed (the Mac keeps running;
#         agents carry on). Skipped when an external monitor is plugged in.
#   no  = don't lock (macOS's own lock timer still applies)
LOCK_SCREEN_WHEN_LID_CLOSES=yes


# NOTIFY WHEN PUT TO SLEEP
#   yes = when lidguard puts the Mac to sleep, post a notification saying why
#         (you'll see it on the lock screen when you open the lid)
NOTIFY_ON_SLEEP=yes


# START AT LOGIN
#   yes = lidguard and its menu bar icon start when you log in
#   no  = they don't; open Lidguard.app yourself when you want it
START_AT_LOGIN=yes

# TURN ON AT LOGIN
#   no  = after logging in, lidguard starts switched OFF (and Keep Awake off);
#         click the menu bar icon to turn it on
#   yes = keep whatever on/off state it had before
TURN_ON_AT_LOGIN=no


# HOW OFTEN TO CHECK (seconds)
#   How often lidguard looks at Herdr and the lid. Lower = reacts faster
#   (e.g. locks sooner after closing the lid). Each check is tiny, so 1–5 is fine.
CHECK_EVERY_SECONDS=2


# PAUSE BEFORE SLEEPING (seconds)
#   After agents stop working, wait this long before letting the Mac sleep,
#   so a brief pause between an agent's steps doesn't send it to sleep.
WAIT_BEFORE_SLEEP_SECONDS=20
